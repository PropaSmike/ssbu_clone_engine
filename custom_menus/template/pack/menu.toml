# The pack's modes, each a row on the engine's modes page (X on the main menu).
# Compile lua/*.lua with Ultimate's luac (docs/wiki/MENUS.md, "Lua") into
# ui/script/menu/template_menu/<name>.lc beside this file.

[[mode]]
id = "template_gauntlet"                 # lower case letters, digits and _
name = "Template Gauntlet"               # the row's name
description = "Rounds against CPUs with a team of three, then a boss."
runs_as = "melee_normal"                 # the game's mode it runs as: Smash
scene = "IngameCallSequenceScene"        # straight into the battle, no select screens
script = "menu/template_menu/gauntlet"   # its decide asks the plugin to set the battle up
order = 20                               # rows sort by it

[[mode]]
id = "template_boss"
name = "Template Boss"
description = "The game's own boss battle against Galleom."
runs_as = "melee_normal"
scene = "IngameCallSequenceScene"
script = "menu/template_menu/boss"
order = 21

[[mode]]
id = "template_pick"
name = "Template Pick"
description = "Pick fighters, then fight on Battlefield; this row comes back after the battle."
runs_as = "melee_normal"
skip = ["rules", "stage_select"]         # screens the mode goes without
after_battle = "menu"                    # back to this row after each battle
script = "menu/template_menu/pick"       # sets the stage and rules the skipped screens would have
order = 22

[[mode]]
id = "template_intro"
name = "Template Intro"
description = "A screen inside the modes page that plays a movie."
script = "menu/template_menu/intro"      # with enter, the mode runs as a screen of the page
order = 23

