[package]
name = "clone_engine_moveset_template_v2"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
crate-type = ["cdylib"]

[dependencies]
clone_engine_api = { path = "../../clone_engine_api" }
skyline = { git = "https://github.com/ultimate-research/skyline-rs.git", rev = "6b52d321275639f26c2371d8142550ba0013a5e4" }
smash_script = { git = "https://github.com/WuBoytH/smash-script.git", rev = "24c5b69b79c7d7b041c3993ecd766ceccf950c2b" }
smashline = { git = "https://github.com/HDR-Development/smashline", rev = "df194a03b918116adb7bda1c2b4565dcd82a4756" }
the_csk_collection_api = { git = "https://github.com/Coolsonickirby/the_csk_collection_api.git", rev = "e144a25f97c247c058b8cd8641df0435b0ffe361" }
param_config = { git = "https://github.com/csharpm7/lib_paramconfig.git" }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
